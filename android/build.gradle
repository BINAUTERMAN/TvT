plugins { id 'com.android.application' version '8.6.1' }

android {
    namespace 'cn.ting.music'
    compileSdk 34
    defaultConfig {
        applicationId 'cn.ting.music'
        minSdk 26
        targetSdk 34
        versionCode 21
        versionName '0.5.2'
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['../build/assets']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
