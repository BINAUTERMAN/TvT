name: Android release
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
      - '.gitignore'
      - '.gitattributes'
      - '.prettierrc.json'
  workflow_dispatch:
    inputs:
      rollback:
        description: '将本次构建标记为回退修复版（先用 git revert 恢复目标代码）'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TING_UPDATE_REPOSITORY: ${{ github.repository }}
      TING_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      TING_KEYSTORE_PATH: ${{ github.workspace }}\build\release.keystore
      TING_ROLLBACK: ${{ inputs.rollback || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare SDK and signing
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (!$env:KEYSTORE_BASE64 -or !$env:TING_SIGNING_PASSWORD) { throw 'Configure release signing secrets first' }
          New-Item -ItemType Directory -Force build | Out-Null
          [IO.File]::WriteAllBytes($env:TING_KEYSTORE_PATH, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" 'platforms;android-34' 'build-tools;34.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK setup failed' }
          $sequence = 100000 + [long]'${{ github.run_number }}'
          "TING_VERSION_CODE=$sequence" >> $env:GITHUB_ENV
      - run: npm ci
      - name: Verify interface and protocol
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $server = Start-Process -FilePath node -ArgumentList 'node_modules/vite/bin/vite.js','web','--host','127.0.0.1','--port','5173','--strictPort' -PassThru -WindowStyle Hidden -RedirectStandardOutput build/vite.log -RedirectStandardError build/vite-error.log
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                Invoke-WebRequest 'http://127.0.0.1:5173' -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (!$ready) { throw 'Interface test server did not start' }
            npm test
            if ($LASTEXITCODE -ne 0) { throw 'Interface tests failed' }
            node scripts/test-login-protocol.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Protocol tests failed' }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
      - run: node scripts/ci-version.mjs
      - run: npm run apk
      - name: Generate update manifest
        shell: pwsh
        run: |
          $apk = Get-ChildItem artifacts -Filter '*preview.apk' | Select-Object -First 1
          node scripts/release-manifest.mjs $apk.FullName
      - name: Publish GitHub Release
        if: "!contains(github.event.head_commit.message, '[skip release]')"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-$env:TING_VERSION_CODE"
          $releaseFiles = @(Get-ChildItem artifacts/release -File | ForEach-Object { $_.FullName })
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version -replace '\.0$', ''
          gh release create $tag @releaseFiles --target '${{ github.sha }}' --title "TvT $version" --notes-file config/release-notes.txt --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publishing failed' }
      - name: Remove signing material
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:TING_KEYSTORE_PATH) { Remove-Item -LiteralPath $env:TING_KEYSTORE_PATH -Force }
